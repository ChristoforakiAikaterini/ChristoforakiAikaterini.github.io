<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aikaterini Christoforaki | Motorsport Engineering</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        /* =========================================================
           BASE
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #030303;
            color: #f3f0e9;
            font-family: "Inter", sans-serif;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================================================
           PAGE
        ========================================================= */

        .page {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            border: 1px solid rgba(180, 145, 70, 0.10);
        }

        .page::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;

            background:
                radial-gradient(
                    circle at 78% 45%,
                    rgba(120, 20, 25, 0.035),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 20% 80%,
                    rgba(170, 125, 40, 0.025),
                    transparent 30%
                );

            z-index: 0;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        header {
            position: relative;
            z-index: 20;

            height: 105px;
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 58px;
        }


        /* =========================================================
           AC LOGO
           ONLY CHANGE: elegant serif, no underline
        ========================================================= */

        .logo {
            position: relative;

            display: flex;
            align-items: center;

            font-family: "Cormorant Garamond", serif;
            font-size: 54px;
            font-weight: 500;
            font-style: normal;

            letter-spacing: -0.065em;
            line-height: 1;

            color: #c99a3d;

            width: 105px;
            height: 60px;
        }

        .logo::before,
        .logo::after {
            content: "";

            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            width: 35px;
            height: 1px;

            background: rgba(155, 22, 27, 0.75);
        }

        .logo::before {
            left: -35px;
        }

        .logo::after {
            right: -35px;
        }


        /* =========================================================
           NAVIGATION
        ========================================================= */

        nav {
            display: flex;
            align-items: center;
            gap: 54px;

            margin-left: auto;
            margin-right: 38px;
        }

        nav a {
            position: relative;

            font-family: "Inter", sans-serif;
            font-size: 12px;
            font-weight: 400;

            letter-spacing: 0.28em;
            text-transform: uppercase;

            color: #e9e5dc;

            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #c99a3d;
        }


        /* =========================================================
           HEADER RIGHT
        ========================================================= */

        .header-right {
            display: flex;
            align-items: center;
            gap: 38px;
        }

        .header-divider {
            width: 1px;
            height: 28px;

            background: rgba(201, 154, 61, 0.65);
        }

        .email-icon {
            width: 22px;
            height: 16px;

            border: 1px solid #c99a3d;

            position: relative;
        }

        .email-icon::before,
        .email-icon::after {
            content: "";

            position: absolute;
            top: 2px;

            width: 12px;
            height: 1px;

            background: #c99a3d;
        }

        .email-icon::before {
            left: 0;
            transform: rotate(31deg);
            transform-origin: left center;
        }

        .email-icon::after {
            right: 0;
            transform: rotate(-31deg);
            transform-origin: right center;
        }


        /* =========================================================
           HERO
        ========================================================= */

        .hero {
            position: relative;
            z-index: 5;

            min-height: calc(100vh - 105px);

            display: flex;
            align-items: flex-start;

            padding: 88px 0 0 88px;
        }

        .hero-content {
            position: relative;
            z-index: 10;

            width: 620px;
        }


        /* =========================================================
           EYEBROW
        ========================================================= */

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 15px;

            margin-bottom: 28px;
        }

        .eyebrow-line {
            width: 48px;
            height: 1px;

            background: #9d151c;
        }

        .eyebrow span {
            font-family: "Inter", sans-serif;
            font-size: 11px;
            font-weight: 400;

            letter-spacing: 0.38em;
            text-transform: uppercase;

            color: #c99a3d;
        }


        /* =========================================================
           NAME
        ========================================================= */

        .name {
            font-family: "Cormorant Garamond", serif;

            font-size: clamp(82px, 7.2vw, 118px);
            font-weight: 500;

            line-height: 0.82;
            letter-spacing: -0.055em;

            margin-left: -7px;
        }

        .name .first-name {
            display: block;
            color: #d0a14b;
        }

        .name .last-name {
            display: block;
            color: #f2eee7;
        }


        /* =========================================================
           SUBTITLE
        ========================================================= */

        .subtitle {
            margin-top: 38px;

            display: flex;
            align-items: center;
            gap: 18px;

            font-family: "Inter", sans-serif;
            font-size: 15px;
            font-weight: 400;

            letter-spacing: 0.25em;
            text-transform: uppercase;

            color: #c99a3d;
        }

        .subtitle .dot {
            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #9d151c;
        }


        /* =========================================================
           BUTTONS
        ========================================================= */

        .hero-buttons {
            display: flex;
            gap: 25px;

            margin-top: 42px;
        }

        .hero-button {
            position: relative;

            width: 178px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 23px;

            border: 1px solid rgba(201, 154, 61, 0.85);

            font-family: "Inter", sans-serif;
            font-size: 11px;
            font-weight: 400;

            letter-spacing: 0.22em;
            text-transform: uppercase;

            color: #eae6df;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease;
        }

        .hero-button.projects {
            border-color: #a4161d;
        }

        .hero-button:hover {
            background: rgba(201, 154, 61, 0.08);
        }

        .hero-button.projects:hover {
            background: rgba(164, 22, 29, 0.08);
        }

        .arrow {
            font-size: 20px;
            font-weight: 300;
            line-height: 1;
        }

        .projects .arrow {
            color: #c01821;
        }

        .about .arrow,
        .cv .arrow {
            color: #c99a3d;
        }


        /* =========================================================
           TECHNICAL GRAPHIC
        ========================================================= */

        .technical-graphic {
            position: absolute;

            right: -55px;
            top: -5px;

            width: 760px;
            height: 760px;

            z-index: 1;

            pointer-events: none;
        }

        .circle {
            position: absolute;

            border-radius: 50%;

            border: 1px solid rgba(150, 22, 29, 0.38);
        }

        .circle.one {
            width: 650px;
            height: 650px;

            top: 0;
            left: 45px;
        }

        .circle.two {
            width: 470px;
            height: 470px;

            top: 80px;
            left: 135px;

            border-color: rgba(150, 22, 29, 0.28);
        }

        .circle.three {
            width: 285px;
            height: 285px;

            top: 172px;
            left: 228px;

            border-color: rgba(157, 120, 42, 0.25);
        }

        .circle.four {
            width: 170px;
            height: 170px;

            top: 230px;
            left: 285px;

            border-color: rgba(150, 22, 29, 0.24);
        }


        /* =========================================================
           CURVES
        ========================================================= */

        .curve {
            position: absolute;

            width: 620px;
            height: 160px;

            border-radius: 50%;

            border-top: 1px solid rgba(152, 117, 44, 0.20);

            transform: rotate(-20deg);
        }

        .curve.one {
            top: 225px;
            left: 80px;
        }

        .curve.two {
            top: 315px;
            left: 20px;

            transform: rotate(14deg);

            border-top-color: rgba(155, 21, 28, 0.22);
        }

        .curve.three {
            top: 395px;
            left: 110px;

            transform: rotate(-12deg);

            border-top-color: rgba(153, 117, 45, 0.15);
        }


        /* =========================================================
           CENTER MARK
        ========================================================= */

        .center-mark {
            position: absolute;

            top: 365px;
            left: 365px;

            width: 18px;
            height: 18px;
        }

        .center-mark::before,
        .center-mark::after {
            content: "";

            position: absolute;

            background: rgba(201, 154, 61, 0.65);
        }

        .center-mark::before {
            width: 1px;
            height: 30px;

            left: 9px;
            top: -6px;
        }

        .center-mark::after {
            width: 30px;
            height: 1px;

            left: -6px;
            top: 9px;
        }

        .center-dot {
            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #a4161d;

            left: 7px;
            top: 7px;
        }


        /* =========================================================
           GOLD DOT GRID
        ========================================================= */

        .dot-grid {
            position: absolute;

            display: grid;
            grid-template-columns: repeat(7, 4px);
            grid-auto-rows: 4px;

            gap: 11px;

            opacity: 0.55;

            pointer-events: none;
        }

        .dot-grid span {
            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: #a77b2b;

            opacity: 0.35;

            box-shadow:
                0 0 7px rgba(167, 123, 43, 0.15);
        }

        .gold-grid {
            right: 25px;
            top: 135px;
        }


        /* =========================================================
           RED DOT GRID
        ========================================================= */

        .red-grid {
            position: absolute;

            left: 158px;
            bottom: 20px;

            display: grid;
            grid-template-columns: repeat(7, 4px);
            grid-auto-rows: 4px;

            gap: 11px;

            opacity: 0.45;

            pointer-events: none;
        }

        .red-grid span {
            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: #94131a;

            opacity: 0.32;

            box-shadow:
                0 0 7px rgba(148, 19, 26, 0.12);
        }


        /* =========================================================
           CORNER CIRCLES
        ========================================================= */

        .corner-circle {
            position: absolute;

            border-radius: 50%;

            border: 1px solid rgba(150, 22, 29, 0.25);

            pointer-events: none;
        }

        .corner-circle.one {
            width: 210px;
            height: 210px;

            left: -135px;
            bottom: -115px;
        }

        .corner-circle.two {
            width: 155px;
            height: 155px;

            left: -108px;
            bottom: -90px;

            border-color: rgba(150, 22, 29, 0.17);
        }


        /* =========================================================
           PLUS MARK
        ========================================================= */

        .plus {
            position: absolute;

            width: 28px;
            height: 28px;

            opacity: 0.55;
        }

        .plus::before,
        .plus::after {
            content: "";

            position: absolute;

            background: rgba(201, 154, 61, 0.5);
        }

        .plus::before {
            width: 1px;
            height: 28px;

            left: 13px;
            top: 0;
        }

        .plus::after {
            width: 28px;
            height: 1px;

            left: 0;
            top: 13px;
        }

        .plus.one {
            right: 160px;
            top: 230px;
        }


        /* =========================================================
           SCROLL
        ========================================================= */

        .scroll-indicator {
            position: absolute;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 10px;

            z-index: 15;
        }

        .scroll-text {
            font-family: "Inter", sans-serif;
            font-size: 10px;

            letter-spacing: 0.38em;
            text-transform: uppercase;

            color: #c99a3d;
        }

        .scroll-line {
            position: relative;

            width: 1px;
            height: 48px;

            background: rgba(201, 154, 61, 0.65);
        }

        .scroll-line::after {
            content: "";

            position: absolute;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #a4161d;

            bottom: -3px;
            left: -3px;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 1100px) {

            header {
                padding: 0 35px;
            }

            nav {
                gap: 30px;
            }

            .hero {
                padding-left: 60px;
            }

            .technical-graphic {
                right: -220px;
                opacity: 0.75;
            }
        }


        @media (max-width: 800px) {

            header {
                height: 85px;
                padding: 0 25px;
            }

            nav {
                display: none;
            }

            .header-right {
                margin-left: auto;
            }

            .hero {
                min-height: calc(100vh - 85px);
                padding: 80px 30px 120px;
            }

            .hero-content {
                width: 100%;
            }

            .name {
                font-size: clamp(65px, 15vw, 95px);
            }

            .subtitle {
                flex-wrap: wrap;
                font-size: 11px;
                line-height: 1.8;
            }

            .hero-buttons {
                flex-wrap: wrap;
            }

            .technical-graphic {
                right: -390px;
                top: 80px;
                opacity: 0.35;
            }

            .scroll-indicator {
                display: none;
            }

            .red-grid {
                left: 50px;
            }
        }


        @media (max-width: 500px) {

            .logo {
                font-size: 45px;
            }

            .logo::before,
            .logo::after {
                width: 20px;
            }

            .logo::before {
                left: -22px;
            }

            .logo::after {
                right: -22px;
            }

            .hero {
                padding-left: 25px;
                padding-right: 25px;
            }

            .eyebrow span {
                font-size: 9px;
                letter-spacing: 0.28em;
            }

            .name {
                font-size: 62px;
            }

            .hero-buttons {
                gap: 12px;
            }

            .hero-button {
                width: 165px;
            }
        }

    </style>
</head>


<body>

    <main class="page">

        <header>

            <a href="#" class="logo">AC</a>

            <nav>
                <a href="#projects">Projects</a>
                <a href="#about">About Me</a>
                <a href="#experience">Experience</a>
                <a href="#cv">CV</a>
            </nav>

            <div class="header-right">

                <div class="header-divider"></div>

                <a href="mailto:" aria-label="Email">
                    <div class="email-icon"></div>
                </a>

            </div>

        </header>


        <section class="hero">

            <div class="hero-content">

                <div class="eyebrow">
                    <div class="eyebrow-line"></div>
                    <span>Motorsport Engineering Portfolio</span>
                </div>


                <h1 class="name">
                    <span class="first-name">Aikaterini</span>
                    <span class="last-name">Christoforaki</span>
                </h1>


                <div class="subtitle">

                    <span>Mechanical Engineering</span>

                    <span class="dot"></span>

                    <span>Motorsport</span>

                    <span class="dot"></span>

                    <span>Performance</span>

                </div>


                <div class="hero-buttons">

                    <a href="#projects"
                       class="hero-button projects">

                        <span>View Projects</span>
                        <span class="arrow">→</span>

                    </a>


                    <a href="#about"
                       class="hero-button about">

                        <span>About Me</span>
                        <span class="arrow">→</span>

                    </a>


                    <a href="#cv"
                       class="hero-button cv">

                        <span>CV</span>
                        <span class="arrow">→</span>

                    </a>

                </div>

            </div>


            <div class="technical-graphic">

                <div class="circle one"></div>
                <div class="circle two"></div>
                <div class="circle three"></div>
                <div class="circle four"></div>

                <div class="curve one"></div>
                <div class="curve two"></div>
                <div class="curve three"></div>

                <div class="center-mark">
                    <div class="center-dot"></div>
                </div>

                <div class="plus one"></div>

            </div>


            <div class="dot-grid gold-grid">

                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>

            </div>


            <div class="red-grid">

                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>

            </div>


            <div class="corner-circle one"></div>
            <div class="corner-circle two"></div>


            <div class="scroll-indicator">

                <span class="scroll-text">Scroll</span>

                <div class="scroll-line"></div>

            </div>

        </section>

    </main>

</body>
</html>
