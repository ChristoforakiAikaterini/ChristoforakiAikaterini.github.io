<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aikaterini Christoforaki | Motorsport Engineering</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Ballet&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">


    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #050505;
            color: #f1efeb;
            font-family: "Inter", sans-serif;
            overflow-x: hidden;
        }


        /* =========================================================
           COLOUR PALETTE
        ========================================================= */

        :root {
            --black: #050505;
            --off-white: #eeeae3;
            --gold: #b9944d;
            --gold-soft: #a8874b;
            --red: #741019;
            --red-bright: #9a1621;
            --line: rgba(185, 148, 77, 0.22);
            --red-line: rgba(116, 16, 25, 0.55);
        }


        /* =========================================================
           HERO
        ========================================================= */

        .hero {
            position: relative;
            min-height: 100vh;
            width: 100%;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 72% 48%,
                    rgba(80, 45, 20, 0.035),
                    transparent 38%
                ),
                #050505;
        }


        /* =========================================================
           THIN BORDER
        ========================================================= */

        .hero::before {
            content: "";

            position: absolute;
            inset: 13px;

            border: 1px solid rgba(150, 145, 135, 0.12);

            pointer-events: none;
            z-index: 20;
        }


        /* =========================================================
           NAVIGATION
        ========================================================= */

        .nav {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 115px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5.2vw;

            z-index: 10;
        }


        /* =========================================================
           AC LOGO
        ========================================================= */

        .logo {
            position: relative;

            display: flex;
            align-items: center;

            font-family: "Ballet", cursive;
            font-size: 48px;
            font-weight: 400;

            color: var(--gold);

            letter-spacing: 0;
            text-decoration: none;
        }


        /* =========================================================
           NAV LINKS
        ========================================================= */

        .nav-right {
            display: flex;
            align-items: center;
            gap: 48px;
        }

        .nav-link {
            position: relative;

            color: #e7e3dd;
            text-decoration: none;

            font-family: "Inter", sans-serif;
            font-size: 11px;
            font-weight: 400;

            letter-spacing: 3px;
            text-transform: uppercase;

            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: var(--gold);
        }


        /* =========================================================
           NAV DIVIDER
        ========================================================= */

        .nav-divider {
            width: 1px;
            height: 28px;

            background: var(--gold);

            opacity: 0.65;

            margin-left: 2px;
        }


        /* =========================================================
           MAIL ICON
        ========================================================= */

        .mail {
            width: 22px;
            height: 16px;

            border: 1px solid var(--gold);

            position: relative;

            margin-left: -5px;
        }

        .mail::after {
            content: "";

            position: absolute;

            width: 12px;
            height: 12px;

            border-left: 1px solid var(--gold);
            border-bottom: 1px solid var(--gold);

            transform: rotate(-45deg);

            left: 4px;
            top: -4px;
        }


        /* =========================================================
           MAIN HERO CONTENT
        ========================================================= */

        .hero-content {
            position: relative;
            z-index: 5;

            padding-left: 7.8vw;
            padding-top: 24vh;

            width: 60%;
        }


        /* =========================================================
           SMALL TOP LABEL
        ========================================================= */

        .eyebrow {
            display: flex;
            align-items: center;

            gap: 15px;

            margin-bottom: 30px;
        }

        .eyebrow-line {
            width: 48px;
            height: 1px;

            background: var(--red);
        }

        .eyebrow-text {
            color: var(--gold);

            font-size: 10px;
            font-weight: 400;

            letter-spacing: 4px;
            text-transform: uppercase;
        }


        /* =========================================================
           NAME
        ========================================================= */

        .name {
            font-family: "Cormorant Garamond", serif;

            font-size: clamp(82px, 7.2vw, 126px);

            font-weight: 400;
            line-height: 0.78;

            letter-spacing: -4px;

            margin-left: -5px;

            white-space: nowrap;
        }

        .first-name {
            display: block;
            color: var(--gold);
        }

        .last-name {
            display: block;
            color: var(--off-white);

            margin-top: 8px;
        }


        /* =========================================================
           SPECIALISATION LINE
        ========================================================= */

        .specialisation {
            display: flex;
            align-items: center;

            margin-top: 42px;

            color: var(--gold);

            font-size: 12px;
            font-weight: 400;

            letter-spacing: 3px;
            text-transform: uppercase;

            white-space: nowrap;
        }

        .specialisation span {
            margin: 0 14px;

            color: var(--red-bright);

            font-size: 10px;
        }


        /* =========================================================
           BUTTONS
        ========================================================= */

        .buttons {
            display: flex;
            gap: 25px;

            margin-top: 42px;
        }

        .button {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: space-between;

            width: 175px;
            height: 46px;

            padding: 0 20px;

            text-decoration: none;

            color: #e7e3dd;

            border: 1px solid var(--gold-soft);

            font-size: 10px;
            font-weight: 400;

            letter-spacing: 2px;
            text-transform: uppercase;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease;
        }


        /* FIRST BUTTON RED */

        .button:first-child {
            border-color: var(--red-bright);
        }

        .button:first-child .arrow {
            color: var(--red-bright);
        }

        .button:hover {
            background: rgba(185, 148, 77, 0.06);
            color: var(--gold);
        }

        .button:first-child:hover {
            background: rgba(116, 16, 25, 0.08);
            color: #eeeae3;
        }

        .arrow {
            font-size: 20px;
            font-weight: 300;

            line-height: 1;

            color: var(--gold);
        }


        /* =========================================================
           RIGHT SIDE GRAPHICS
        ========================================================= */

        .graphics {
            position: absolute;

            width: 58vw;
            height: 58vw;

            max-width: 850px;
            max-height: 850px;

            right: -10vw;
            top: 8vh;

            z-index: 1;

            pointer-events: none;
        }


        /* =========================================================
           LARGE CIRCLES
        ========================================================= */

        .circle {
            position: absolute;

            border-radius: 50%;

            border: 1px solid var(--red-line);

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);
        }

        .circle-1 {
            width: 88%;
            height: 88%;
        }

        .circle-2 {
            width: 67%;
            height: 67%;

            border-color: rgba(116, 16, 25, 0.38);
        }

        .circle-3 {
            width: 48%;
            height: 48%;

            border-color: rgba(185, 148, 77, 0.16);
        }

        .circle-4 {
            width: 29%;
            height: 29%;

            border-color: rgba(116, 16, 25, 0.32);
        }


        /* =========================================================
           ORBIT LINES
        ========================================================= */

        .orbit {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 77%;
            height: 29%;

            border: 1px solid rgba(185, 148, 77, 0.12);

            border-radius: 50%;

            transform:
                translate(-50%, -50%)
                rotate(-25deg);
        }

        .orbit-2 {
            transform:
                translate(-50%, -50%)
                rotate(28deg);

            width: 86%;
            height: 25%;

            border-color: rgba(116, 16, 25, 0.16);
        }

        .orbit-3 {
            transform:
                translate(-50%, -50%)
                rotate(-8deg);

            width: 92%;
            height: 20%;

            border-color: rgba(185, 148, 77, 0.08);
        }


        /* =========================================================
           CENTRAL CROSS
        ========================================================= */

        .cross {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 22px;
            height: 22px;

            transform: translate(-50%, -50%);
        }

        .cross::before,
        .cross::after {
            content: "";

            position: absolute;

            background: rgba(185, 148, 77, 0.55);
        }

        .cross::before {
            width: 22px;
            height: 1px;

            top: 10px;
            left: 0;
        }

        .cross::after {
            width: 1px;
            height: 22px;

            left: 10px;
            top: 0;
        }


        /* =========================================================
           CENTRAL RED DOT
        ========================================================= */

        .center-dot {
            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: var(--red-bright);

            left: calc(50% - 2px);
            top: calc(50% - 2px);

            box-shadow:
                0 0 12px rgba(154, 22, 33, 0.45);
        }


        /* =========================================================
           SMALL PLUS
        ========================================================= */

        .plus {
            position: absolute;

            width: 22px;
            height: 22px;

            right: 28%;
            top: 29%;
        }

        .plus::before,
        .plus::after {
            content: "";

            position: absolute;

            background: rgba(185, 148, 77, 0.38);
        }

        .plus::before {
            width: 22px;
            height: 1px;

            top: 10px;
        }

        .plus::after {
            width: 1px;
            height: 22px;

            left: 10px;
        }


        /* =========================================================
           TOP RIGHT DOT GRID
        ========================================================= */

        .dot-grid {
            position: absolute;

            display: grid;

            grid-template-columns: repeat(7, 4px);
            grid-template-rows: repeat(5, 4px);

            gap: 10px;

            right: 2vw;
            top: 18vh;

            /*
               Soft fade into the background.
               The centre remains visible while
               the outer dots disappear gradually.
            */
            mask-image: radial-gradient(
                ellipse at center,
                black 15%,
                rgba(0, 0, 0, 0.72) 45%,
                transparent 88%
            );

            -webkit-mask-image: radial-gradient(
                ellipse at center,
                black 15%,
                rgba(0, 0, 0, 0.72) 45%,
                transparent 88%
            );
        }

        .dot-grid span {
            width: 2px;
            height: 2px;

            background: var(--gold);

            opacity: 0.28;
        }


        /* =========================================================
           BOTTOM LEFT DOT GRID
        ========================================================= */

        .dot-grid-bottom {
            position: absolute;

            display: grid;

            grid-template-columns: repeat(7, 4px);
            grid-template-rows: repeat(5, 4px);

            gap: 10px;

            left: 9vw;
            bottom: 4vh;

            /*
               Soft fade into the background.
            */
            mask-image: radial-gradient(
                ellipse at center,
                black 10%,
                rgba(0, 0, 0, 0.58) 45%,
                transparent 88%
            );

            -webkit-mask-image: radial-gradient(
                ellipse at center,
                black 10%,
                rgba(0, 0, 0, 0.58) 45%,
                transparent 88%
            );
        }

        .dot-grid-bottom span {
            width: 2px;
            height: 2px;

            background: var(--red-bright);

            opacity: 0.38;
        }


        /* =========================================================
           BOTTOM LEFT CIRCLE
        ========================================================= */

        .bottom-circle {
            position: absolute;

            width: 210px;
            height: 210px;

            left: -120px;
            bottom: -125px;

            border-radius: 50%;

            border: 1px solid rgba(116, 16, 25, 0.35);

            pointer-events: none;
        }

        .bottom-circle::after {
            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            left: 30px;
            top: 30px;

            border-radius: 50%;

            border: 1px solid rgba(116, 16, 25, 0.18);
        }


        /* =========================================================
           SCROLL INDICATOR
        ========================================================= */

        .scroll {
            position: absolute;

            bottom: 34px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;
            flex-direction: column;
            align-items: center;

            z-index: 5;
        }

        .scroll-text {
            color: var(--gold);

            font-size: 9px;
            letter-spacing: 4px;

            margin-bottom: 13px;
        }

        .scroll-line {
            width: 1px;
            height: 32px;

            background: var(--gold);

            position: relative;
        }

        .scroll-line::after {
            content: "";

            position: absolute;

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--red-bright);

            left: -2.5px;
            bottom: -3px;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 1000px) {

            .nav {
                padding: 0 7vw;
            }

            .nav-right {
                gap: 25px;
            }

            .hero-content {
                width: 70%;
                padding-left: 7vw;
            }

            .graphics {
                right: -20vw;
                opacity: 0.8;
            }

            .name {
                font-size: 8vw;
            }
        }


        @media (max-width: 700px) {

            .nav {
                height: 90px;
            }

            .nav-right {
                gap: 15px;
            }

            .nav-link {
                font-size: 8px;
                letter-spacing: 1.5px;
            }

            .nav-link:nth-child(3) {
                display: none;
            }

            .logo {
                font-size: 35px;
            }

            .hero-content {
                width: 100%;
                padding-left: 9vw;
                padding-right: 8vw;
                padding-top: 22vh;
            }

            .name {
                font-size: 17vw;
                line-height: 0.82;
                letter-spacing: -2px;
                white-space: normal;
            }

            .specialisation {
                font-size: 9px;
                letter-spacing: 1.5px;
                flex-wrap: wrap;
            }

            .specialisation span {
                margin: 0 7px;
            }

            .buttons {
                gap: 10px;
            }

            .button {
                width: 130px;
                height: 42px;
                padding: 0 12px;
                font-size: 8px;
                letter-spacing: 1px;
            }

            .graphics {
                width: 110vw;
                height: 110vw;
                right: -45vw;
                top: 28vh;
                opacity: 0.45;
            }

            .dot-grid {
                display: none;
            }

            .dot-grid-bottom {
                left: 8vw;
            }

            .scroll {
                display: none;
            }
        }

    </style>
</head>
